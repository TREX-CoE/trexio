specfile_path: tools/fedora/trexio.spec
files_to_sync:
  - src: tools/fedora/
    dest: ./
    delete: true
    filters:
      - "protect .git*"
      - "protect sources"
      - "protect changelog"
  - .packit.yaml
upstream_package_name: trexio
downstream_package_name: trexio

targets:
  - fedora-latest-x86_64
  - fedora-latest-aarch64
  - fedora-latest-ppc64le
  - fedora-latest-s390x
  - fedora-development-x86_64
  - fedora-development-aarch64
  - fedora-development-ppc64le
  - fedora-development-s390x

jobs:
  - &copr_build
    job: copr_build
    trigger: release
    owner: growl
    project: release
  - <<: *copr_build
    trigger: commit
    branch: master
    project: devpkgs
  - job: copr_build
    trigger: pull_request

  - job: propose_downstream
    trigger: release
    dist_git_branches:
      - fedora-rawhide

  - job: koji_build
    trigger: commit
    dist_git_branches:
      - fedora-all

  - job: bodhi_update
    trigger: commit
    dist_git_branches:
      - fedora-branched

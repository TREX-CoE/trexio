name: TREXIO CI

on:
  push:
    branches:
      - master
    tags:
      # After vMajor.Minor.Patch _anything_ is allowed (without "/") !
      - v[0-9]+.[0-9]+.[0-9]+*
  pull_request:
    branches: [ master ]

permissions:
  contents: read
  actions: write

env:
  # GCC 14 turned these four warnings into errors by default, which is how the
  # Fedora i686 build caught a SWIG wrapper passing long* where int64_t* was
  # expected. Older compilers only warn, so every lane asks for them explicitly
  # and the same mistake fails everywhere rather than on one distribution.
  TREXIO_STRICT_CFLAGS: >-
    -Werror=implicit-function-declaration
    -Werror=implicit-int
    -Werror=int-conversion
    -Werror=incompatible-pointer-types


jobs:

  get_commit_message:
    name: Get commit message
    runs-on: ubuntu-22.04
    outputs:
      message: ${{ steps.commit_message.outputs.message }}
    steps:
      - name: Checkout the repo
        uses: actions/checkout@v7
        # Gets the correct commit message for pull request
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Get commit message
        id: commit_message
        run: |
          set -xe
          COMMIT_MSG=$(git log --no-merges -1 --oneline)
          echo "message=$COMMIT_MSG" >> $GITHUB_OUTPUT
          echo github.ref ${{ github.ref }}

  trexio_ubuntu:
    name: x86 and arm64 Ubuntu
    strategy:
      matrix:
        os: [ubuntu-22.04, ubuntu-22.04-arm]
    runs-on: ${{ matrix.os }}
    needs: get_commit_message

    steps:
      - uses: actions/checkout@v7

      - name: check versions
        run: |
          grep AC_INIT configure.ac | tr -d '[]' | awk -F, '{ print $2 }' > configure_v
          grep -w VERSION CMakeLists.txt | grep -v 'cmake_minimum_required' | awk '{ print $2 }' > cmake_v
          grep version python/pytrexio/_version.py | tr -d '"' | awk '{ print $3 }' > python_v
          grep version rust/trexio/Cargo.toml | grep -v features | tr -d '"' | awk '{ print $3 }' > rust_v
          grep version ocaml/trexio/dune-project | tr -d '()' | awk '{ print $2 }' > ocaml_v
          diff configure_v cmake_v
          diff configure_v python_v
          diff configure_v rust_v
          diff configure_v ocaml_v

      - name: setup fixed Python version for testing
        uses: actions/setup-python@v7
        with:
          python-version: '3.10'

      - name: install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install libhdf5-dev emacs libtool-bin valgrind cmake
          # Needed to build the Python API from the build systems rather than
          # from pip: SWIG for the wrapper, the NumPy headers to compile it and
          # pytest so that make check and ctest actually run the Python tests.
          python3 -m pip install --upgrade pip
          python3 -m pip install numpy pytest swig==4.3

      - name: configure with autotools
        run: |
          ./autogen.sh
          ./configure --enable-silent-rules --enable-python \
                      CFLAGS="-g -O2 $TREXIO_STRICT_CFLAGS"

      - name: compile TREXIO
        run: make -j2

      - name: check TREXIO
        run: make -j2 check

      - name: check via valgrind
        if: matrix.os != 'ubuntu-22.04-arm'
        run: cd tests && ./run_valgrind.sh

      - name: Archive test log file
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-report-ubuntu
          path: test-suite.log

      - name: create venv with swig 4.1
        run: |
          python3 -m venv trexio-venv
          source trexio-venv/bin/activate
          pip install swig==4.1

      - name: install Python API
        run: |
          source trexio-venv/bin/activate
          make python-install

      - name: check Python API
        run: |
          source trexio-venv/bin/activate
          make python-test

      - name: install Python API with swig 4.3
        run: |
          source trexio-venv/bin/activate
          pip install swig==4.3
          make python-install

      - name: check Python API with swig 4.3
        run: |
          source trexio-venv/bin/activate
          make python-test

      - name: build and move Python API distribution
        run: |
          source trexio-venv/bin/activate
          make python-sdist
          cp python/dist/trexio-*.tar.gz .

      - name: publish Python API distribution as an artifact
        if: >-
          contains(needs.get_commit_message.outputs.message, '[wheel build]') &&
          matrix.os == 'ubuntu-22.04-arm'
        uses: actions/upload-artifact@v7
        with:
          name: pytrexio-source
          path: ./trexio-*.tar.gz

      - name: maintainer clean
        run: make maintainer-clean

      - name: reconfigure with debugging
        run: |
          ./autogen.sh
          ./configure --enable-silent-rules --enable-debug --enable-sanitizer \
                      CFLAGS="-g -O2 $TREXIO_STRICT_CFLAGS"

      - name: recompile TREXIO
        run: make -j2

      - name: recheck TREXIO
        run: make -j2 check

      - name: Archive test log file
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-report-ubuntu-memory
          path: test-suite.log

      - name: maintainer clean
        run: make maintainer-clean

      - name: configure with CMake
        run: |
          cmake -S. -Bbuilddir -DTREXIO_PYTHON=ON \
                -DCMAKE_C_FLAGS="$TREXIO_STRICT_CFLAGS"

      - name: compile TREXIO
        working-directory: builddir
        run: make -j2

      - name: check TREXIO
        working-directory: builddir
        run: ctest -j2

      - name: maintainer clean
        run: rm -rf -- builddir/

  trexio_i686:
    name: i686 (32-bit) Linux
    runs-on: ubuntu-22.04
    needs: get_commit_message

    steps:
      - uses: actions/checkout@v7

      - name: install 32-bit dependencies
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y gcc-multilib gfortran-multilib \
                                  emacs libtool-bin automake autoconf pkg-config \
                                  zlib1g-dev:i386 wget

      - name: cache 32-bit HDF5
        id: cache-hdf5-i686
        uses: actions/cache@v5
        with:
          path: ~/hdf5-i686
          key: hdf5-1.14.6-i686-static

      - name: build 32-bit HDF5
        if: steps.cache-hdf5-i686.outputs.cache-hit != 'true'
        run: |
          wget -q https://github.com/HDFGroup/hdf5/releases/download/hdf5_1.14.6/hdf5-1.14.6.tar.gz
          tar xf hdf5-1.14.6.tar.gz
          cd hdf5-1.14.6
          CC="gcc -m32" ./configure --prefix=$HOME/hdf5-i686 --disable-shared --enable-static \
                                    --disable-tests --disable-tools
          make -j2
          make install

      - name: configure with autotools (32-bit)
        run: |
          ./autogen.sh
          ./configure --enable-silent-rules \
                      CC="gcc -m32" FC="gfortran -m32" \
                      --with-hdf5=$HOME/hdf5-i686 \
                      LIBS="-lz -lm -ldl"

      - name: compile TREXIO
        run: make -j2

      - name: check TREXIO
        run: make -j2 check

      - name: Archive test log file
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-report-i686
          path: test-suite.log

  trexio_i386:
    name: i386 (32-bit) Linux, all bindings
    runs-on: ubuntu-22.04
    needs: get_commit_message

    steps:
      - uses: actions/checkout@v7

      # The Python API cannot be built with gcc -m32 on a 64-bit runner, because
      # that needs a 32-bit Python and NumPy, so this lane uses a native i386
      # image: linux/386 runs directly on an amd64 host, with no emulation. The
      # container is driven from a step rather than declared with "container:",
      # because the runner injects a 64-bit Node into job containers and there is
      # none for i386.
      - name: build and test C, Fortran and Python in an i386 container
        run: |
          docker run --rm --platform linux/386 \
                 -v "$PWD":/src -w /src \
                 -e TREXIO_STRICT_CFLAGS="$TREXIO_STRICT_CFLAGS" \
                 i386/debian:12 bash -euxc '
            apt-get update
            DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
              build-essential gfortran autoconf automake libtool pkg-config \
              libhdf5-dev swig python3-dev python3-numpy python3-pytest \
              cmake emacs-nox git ca-certificates
            ./autogen.sh
            ./configure --enable-silent-rules --enable-python \
                        CFLAGS="-g -O2 $TREXIO_STRICT_CFLAGS"
            make -j2
            make -j2 check
            make distclean
            cmake -S. -Bbuilddir -DTREXIO_PYTHON=ON \
                  -DCMAKE_C_FLAGS="$TREXIO_STRICT_CFLAGS"
            cmake --build builddir -j2
            ctest --test-dir builddir -j2 --output-on-failure
          '

      - name: Archive test log file
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-report-i386
          path: test-suite.log

  trexio_macos:
    name: x86 and arm64 MacOS
    strategy:
      matrix:
        os: [macos-15] #, macos-15-intel]
    runs-on: ${{ matrix.os }}

    env:
      GCC_VERSION: 14

    steps:
      - uses: actions/checkout@v7

      - name: setup fixed Python version for testing
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: install dependencies
        run: |
          brew install emacs
          brew install hdf5
          brew install automake
          brew install libtool
          pip install swig==4.3 numpy pytest
          swig -version

      - name: configure with autotools
        run: |
          brew --prefix hdf5
          ./autogen.sh
          ./configure CC=gcc-$GCC_VERSION FC=gfortran-$GCC_VERSION \
                      --enable-silent-rules --enable-python \
                      CFLAGS="-g -O2 $TREXIO_STRICT_CFLAGS"

      - name: compile TREXIO
        run: make -j3

      - name: check TREXIO
        run: make -j3 check

      - name: create venv
        run: |
          python3 -m venv trexio-venv
          source trexio-venv/bin/activate

      - name: compile Python API
        run: |
          export H5_CFLAGS="-I$(brew --prefix hdf5)/include"
          export H5_LDFLAGS="-L$(brew --prefix hdf5)/lib"
          source trexio-venv/bin/activate
          make python-install

      - name: test Python API
        run: |
          source trexio-venv/bin/activate
          make python-test

      - name: Archive test log file
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-report-${{ matrix.os }}
          path: test-suite.log

      - name: clean
        run: make clean

  trexio_windows:
    name: Windows MinGW
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}

    env:
      # The code generation needs an interpreter that this Emacs can drive, and
      # that is not the MinGW Python the extension module is built against: with
      # the MinGW one ahead on PATH, Emacs spawns it but cannot talk to it, and
      # the org-babel blocks silently yield nothing, leaving a trex.json with no
      # groups in it. The MSYS Python matches the MSYS Emacs.
      TREXIO_BABEL_PYTHON: /usr/bin/python3 -q
    steps:
      - uses: actions/checkout@v7

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-gcc-fortran
            mingw-w64-x86_64-hdf5
            mingw-w64-x86_64-autotools
            mingw-w64-x86_64-libtool
            mingw-w64-x86_64-pkg-config
            mingw-w64-x86_64-swig
            mingw-w64-x86_64-python
            mingw-w64-x86_64-python-numpy
            mingw-w64-x86_64-python-pytest
            emacs
            python
            git
            make

      # Windows is LLP64, so long is 32 bits wide even though the target is not:
      # building the Python API here is what keeps the SWIG word size honest on a
      # platform where it differs from the Unix ones.
      # Dependency tracking is turned off because config.status cannot bootstrap
      # its makefile fragments here once the extension module is in the build,
      # and a one-shot CI build has no use for it anyway.
      - name: configure with autotools
        run: |
          ./autogen.sh
          ./configure --enable-silent-rules --enable-python \
                      --disable-dependency-tracking \
                      CFLAGS="-g -O2 $TREXIO_STRICT_CFLAGS"

      - name: compile TREXIO
        run: make -j2

      - name: check TREXIO
        run: make -j2 check

      - name: Archive test log file
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-report-windows
          path: test-suite.log

  trexio_source_tarball:
    name: Build C-source release tarball
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v7

      - name: install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libhdf5-dev emacs libtool-bin automake autoconf pkg-config

      - name: configure with autotools
        run: |
          ./autogen.sh
          ./configure --enable-silent-rules

      # "make dist" tangles the org-mode sources and ships the resulting C code
      # together with the CMake files, so that consumers of the artifact never
      # need Emacs. Note that .devel is deliberately not distributed, which is
      # what keeps TREXIO_DEVEL off in the extracted tree.
      - name: build the source tarball
        run: |
          make -j2
          make dist

      - name: publish the source tarball as an artifact
        uses: actions/upload-artifact@v7
        with:
          name: trexio-source-tarball
          path: ./trexio-*.tar.gz
          retention-days: 7

  trexio_windows_clang_cl:
    name: Windows clang-cl (CMake + conda)
    runs-on: windows-latest
    needs: trexio_source_tarball
    defaults:
      run:
        shell: bash -l {0}

    steps:
      # This must be done *before* setting up miniconda, see:
      # https://github.com/ilammy/msvc-dev-cmd/issues/34
      - name: prepare compiler environment, vcvarsall
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: write a conda env file
        run: |
          cat > export.yaml <<EOF
          name: test
          channels:
            - conda-forge
          dependencies:
            - cmake
            - ninja
            - clang
            - hdf5
            - swig
            - python
            - numpy
            - pytest
          EOF
          cat export.yaml

      - name: create conda environment
        uses: conda-incubator/setup-miniconda@v3
        with:
          activate-environment: test
          environment-file: export.yaml
          channels: conda-forge
          show-channel-urls: true
          auto-activate: false
          conda-remove-defaults: true

      # Windows has no Emacs, so the generated C sources arrive pre-tangled
      # from the Linux job above rather than being built from the org files.
      - name: fetch the source tarball
        uses: actions/download-artifact@v7
        with:
          name: trexio-source-tarball

      - name: extract the source tarball
        run: |
          tar -xzf trexio-*.tar.gz
          echo "TREXIO_DIR=$(ls -d trexio-*/ | head -1)" >> $GITHUB_ENV

      # The Fortran interface is disabled because FortranCInterface_VERIFY()
      # has no working clang-cl/Fortran pairing here; the MinGW job above keeps
      # the Windows Fortran path covered.
      #
      # clang counts discarded qualifiers as part of -Wincompatible-pointer-types,
      # where GCC keeps them apart as -Wdiscarded-qualifiers, and SWIG's string
      # typemaps assign the const char* of PyUnicode_AsUTF8 to a char*. That is
      # generated code and harmless, so only that sub-warning is demoted, leaving
      # genuinely mismatched pointer types an error.
      - name: configure with CMake
        run: |
          cmake -S "${TREXIO_DIR}" -Bbuild -GNinja \
                -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_C_COMPILER=clang-cl \
                -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}/installed" \
                -DCMAKE_INSTALL_LIBDIR=lib \
                -DCMAKE_PREFIX_PATH="${CONDA_PREFIX};${CONDA_PREFIX}/Library" \
                -DHDF5_ROOT="${CONDA_PREFIX}/Library" \
                -DCMAKE_C_FLAGS="$TREXIO_STRICT_CFLAGS -Wno-error=incompatible-pointer-types-discards-qualifiers" \
                -DTREXIO_FORTRAN=OFF \
                -DTREXIO_PYTHON=ON

      - name: compile and install TREXIO
        run: cmake --build build --target install

      - name: check TREXIO
        run: ctest --test-dir build --output-on-failure

      - name: Archive test log file
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-report-windows-clang-cl
          path: build/Testing/Temporary/LastTest.log

  trexio_ocaml:
    name: OCaml binding
    strategy:
      matrix:
        os: [ubuntu-22.04, ubuntu-22.04-arm]
    runs-on: ${{ matrix.os }}
    needs: get_commit_message

    steps:
      - uses: actions/checkout@v7

      - name: install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install libhdf5-dev emacs libtool-bin pkg-config

      - name: install TREXIO
        run: |
          ./autogen.sh
          ./configure --enable-silent-rules --prefix="$HOME/trexio-install" \
                      CFLAGS="-g -O2 $TREXIO_STRICT_CFLAGS"
          make -j2
          make install

      # The distribution packages are older than the (lang dune 3.1) the binding
      # asks for, so the toolchain comes from opam.
      - name: set up OCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: '5.2'

      # The stubs are generated from trex.json and the binding finds the library
      # through pkg-config, so this also covers the installed trexio.pc.
      - name: build the OCaml binding
        run: |
          eval $(opam env)
          opam install -y dune dune-configurator
          export PKG_CONFIG_PATH="$HOME/trexio-install/lib/pkgconfig"
          export LD_LIBRARY_PATH="$HOME/trexio-install/lib"
          cd ocaml/trexio
          make sources
          dune build

  trexio_rust:
    name: Rust binding
    strategy:
      matrix:
        os: [ubuntu-22.04, ubuntu-22.04-arm]
    runs-on: ${{ matrix.os }}
    needs: get_commit_message

    steps:
      - uses: actions/checkout@v7

      - name: install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install libhdf5-dev emacs libtool-bin pkg-config \
                               clang libclang-dev

      - name: install TREXIO
        run: |
          ./autogen.sh
          ./configure --enable-silent-rules --prefix="$HOME/trexio-install" \
                      CFLAGS="-g -O2 $TREXIO_STRICT_CFLAGS"
          make -j2
          make install

      # TREXIO_DIR points build.rs at what was just built. Without it the crate
      # downloads the last release and the tests say nothing about this tree.
      - name: build and test the Rust binding
        run: |
          export TREXIO_DIR="$HOME/trexio-install"
          export LD_LIBRARY_PATH="$HOME/trexio-install/lib"
          cd rust/trexio
          cargo build
          cargo test

  trexio_nix:
    name: Nix
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: cachix/install-nix-action@v31.4.1
    - run: nix flake check -L && nix build -L

  trexio_release_tarball:
    name: Test release tarball with CMake and autotools
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - name: install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install libhdf5-dev cmake

      - name: get latest release
        id: get_release
        run: |
          LATEST_RELEASE=$(curl -s https://api.github.com/repos/TREX-CoE/trexio/releases/latest | grep "tag_name" | cut -d '"' -f 4)
          VERSION=$(echo "$LATEST_RELEASE" | sed 's/^v//')
          echo "tag=$LATEST_RELEASE" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Latest release: $LATEST_RELEASE (version: $VERSION)"

      - name: download and extract release tarball
        run: |
          wget https://github.com/TREX-CoE/trexio/releases/download/${{ steps.get_release.outputs.tag }}/trexio-${{ steps.get_release.outputs.version }}.tar.gz
          tar -xzf trexio-${{ steps.get_release.outputs.version }}.tar.gz
          echo "TREXIO_DIR=trexio-${{ steps.get_release.outputs.version }}" >> $GITHUB_ENV

      - name: configure with CMake
        run: |
          cd ${{ env.TREXIO_DIR }}
          cmake -S. -Bbuild

      - name: compile TREXIO
        run: |
          cd ${{ env.TREXIO_DIR }}/build
          make -j2

      - name: test TREXIO
        run: |
          cd ${{ env.TREXIO_DIR }}/build
          ctest -j2

      - name: Archive CMake test log file
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-report-tarball-cmake
          path: ${{ env.TREXIO_DIR }}/build/Testing/Temporary/LastTest.log

      - name: clean CMake build
        run: |
          cd ${{ env.TREXIO_DIR }}
          rm -rf build

      - name: configure with autotools
        run: |
          cd ${{ env.TREXIO_DIR }}
          ./configure --enable-silent-rules

      - name: compile TREXIO with autotools
        run: |
          cd ${{ env.TREXIO_DIR }}
          make -j2

      - name: test TREXIO with autotools
        run: |
          cd ${{ env.TREXIO_DIR }}
          make -j2 check

      - name: Archive autotools test log file
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-report-tarball-autotools
          path: ${{ env.TREXIO_DIR }}/test-suite.log
